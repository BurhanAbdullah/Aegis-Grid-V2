name: Project Release Validation
on:
  push:
    branches: [project-release-20260815]
  pull_request:
    branches: [project-release-20260815]
jobs:
  project-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m compileall -q core scripts tests
      - run: python scripts/validate_canonical_benchmarks.py
      - run: python scripts/validate_current_pipeline.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/physical_sanity_check.py
      - run: python scripts/validate_reproducibility_contract.py
      - run: python scripts/project_release_audit.py
