name: Real Scientific Validation

on:
  push:
    branches: ["real-validation-20260813"]
  pull_request:
    branches: ["tsg-clean-reproduction"]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scientific stack
        run: python -m pip install --upgrade pip && python -m pip install numpy scipy scikit-learn matplotlib pypower==5.1.19
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Canonical physical and Jacobian validation
        run: python validation/real_physical_validation.py
      - name: Run physically grounded experiment (no figures yet)
        run: python scripts/run_verified_physical_experiment.py results/real_validation_run
      - name: Final scientific result gate
        run: python validation/final_gate.py results/real_validation_run
      - name: Bootstrap confidence intervals and paired tests
        run: python scripts/postprocess_statistics.py results/real_validation_run
      - name: Generate paper figures only after gate
        run: python scripts/generate_paper_figures.py results/real_validation_run
      - name: Re-freeze complete artifact bundle
        run: |
          python - <<'PY'
          import hashlib, os
          root='results/real_validation_run'
          lines=[]
          for d,_,files in os.walk(root):
              for name in sorted(files):
                  if name=='SHA256SUMS.txt': continue
                  p=os.path.join(d,name)
                  lines.append(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+os.path.relpath(p,root))
          open(os.path.join(root,'SHA256SUMS.txt'),'w').write('\n'.join(lines)+'\n')
          print(f'FINAL SHA256 FREEZE: {len(lines)} artifacts')
          PY
      - name: Upload complete result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XMON-Grid-real-validation-final
          path: results/real_validation_run/
          if-no-files-found: ignore
